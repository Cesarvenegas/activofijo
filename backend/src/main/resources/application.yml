# Configuración común a todos los perfiles.
# Perfil por defecto: dev. En producción se arranca con SPRING_PROFILES_ACTIVE=prod.
spring:
  application:
    name: kromas-inventa-gov
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # el esquema lo maneja Flyway, nunca Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: America/Santiago
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
