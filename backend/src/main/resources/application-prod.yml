# Producción: todo por variables de entorno, nunca credenciales en el repositorio.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework   # detrás de Nginx/Apache
  servlet:
    session:
      cookie:
        secure: true                    # solo por HTTPS

logging:
  level:
    root: INFO
